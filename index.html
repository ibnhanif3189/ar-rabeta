<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR-RABETA Online</title><style>
body{font-family:system-ui,'Noto Sans Bengali',sans-serif;background:#f3f7f3;color:#183326;margin:0}header{background:#0b4b2e;color:white;padding:18px;text-align:center}main{max-width:650px;margin:28px auto;padding:0 14px}.box{background:white;border:1px solid #dce8dd;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 16px #1233}input,button{font:inherit;padding:12px;border-radius:9px;width:100%;box-sizing:border-box}input{border:1px solid #ccd9ce;margin:8px 0}button{background:#087342;color:white;border:0;font-weight:700;cursor:pointer}small{color:#617468}.hidden{display:none}.row{display:flex;justify-content:space-between;border-bottom:1px solid #e5ece6;padding:10px 0;gap:12px}.error{color:#b42318}.muted{color:#617468;font-size:13px}
</style></head><body><header><h1>AR-RABETA</h1><div>We Progress Together · Established 2024</div></header><main>
<div class="box" id="login"><h2>সদস্য লগইন / Member Login</h2><p class="muted">নিজের ৬ ডিজিটের সদস্য কোড দিন।</p><input id="code" inputmode="numeric" maxlength="6" placeholder="৬ ডিজিট Member Code"><button onclick="login()">প্রবেশ করুন / Login</button><p id="msg" class="error"></p></div>
<div class="box hidden" id="account"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="name">Member</h2><button style="width:auto" onclick="logout()">Logout</button></div><div id="details"></div><h3>জমার ইতিহাস / Deposit history</h3><div id="ledger"></div></div>
<p class="muted">এই পোর্টালটি শুধুমাত্র স্থায়ী সদস্যদের ব্যক্তিগত হিসাব দেখায়।</p>
</main><script src="./config.js"></script><script>
const api=window.AR_RABETA_CONFIG.SUPABASE_URL+'/functions/v1/ar-rabeta-api',anon=window.AR_RABETA_CONFIG.SUPABASE_ANON_KEY;
let token=sessionStorage.getItem('ar_member_token')||'';
async function call(body){const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json','apikey':anon,'Authorization':'Bearer '+anon},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function login(){let code=document.getElementById('code').value.trim();document.getElementById('msg').textContent='';try{const d=await call({action:'member-login',code});token=d.token;sessionStorage.setItem('ar_member_token',token);await load()}catch(e){document.getElementById('msg').textContent=e.message}}
async function load(){try{const d=await call({action:'member-account',token});document.getElementById('login').classList.add('hidden');document.getElementById('account').classList.remove('hidden');document.getElementById('name').textContent=d.member.full_name;document.getElementById('details').innerHTML='<div class="row"><span>মাসিক সঞ্চয়</span><b>৳'+Number(d.member.monthly_savings).toLocaleString()+'</b></div><div class="row"><span>যোগদানের তারিখ</span><b>'+d.member.join_date+'</b></div>';let total=d.transactions.reduce((a,t)=>a+Number(t.amount),0);document.getElementById('ledger').innerHTML=d.transactions.map(t=>'<div class="row"><span>'+t.transaction_date+'<br><small>'+escapeHtml(t.description)+'</small></span><b>৳'+Number(t.amount).toLocaleString()+'</b></div>').join('')||'<p>এখনো কোনো জমা নেই।</p>';document.getElementById('ledger').innerHTML+='<div class="row"><b>মোট সঞ্চয়</b><b>৳'+total.toLocaleString()+'</b></div>'}catch(e){logout();document.getElementById('msg').textContent=e.message}}
function logout(){token='';sessionStorage.removeItem('ar_member_token');document.getElementById('account').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(token)load();
</script></body></html>
