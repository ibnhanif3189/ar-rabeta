<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR-RABETA Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600&family=Noto+Serif+Bengali:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0E6B52;
    --primary-dark: #094c3a;
    --bg: #F2F5F1;
    --text: #16241F;
    --muted: #55665F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans Bengali", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: #FFFFFF;
    padding: 40px 24px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    max-width: 400px;
    width: 100%;
    text-align: center;
  }
  .logo-area {
    margin-bottom: 24px;
  }
  h1 {
    font-family: "Noto Serif Bengali", serif;
    font-size: 2.2rem;
    color: var(--primary);
    margin-bottom: 8px;
  }
  p.subtitle {
    color: var(--muted);
    font-size: 1rem;
    margin-bottom: 32px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    margin-bottom: 16px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    font-size: 1.1rem;
    transition: all 0.2s ease;
  }
  .btn-admin {
    background: var(--primary);
    color: #FFFFFF;
    box-shadow: 0 4px 12px rgba(14, 107, 82, 0.3);
  }
  .btn-admin:active {
    background: var(--primary-dark);
  }
  .btn-member {
    background: transparent;
    color: var(--primary);
    border: 2px solid var(--primary);
  }
  .btn-member:active {
    background: rgba(14, 107, 82, 0.05);
  }
  .footer {
    margin-top: 30px;
    font-size: 0.85rem;
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="container">
  <div class="logo-area">
    <h1>AR-RABETA</h1>
    <p class="subtitle">We Progress Together · Established 2024</p>
  </div>

  <a href="admin.html" class="btn btn-admin">অ্যাডমিন প্যানেল (Admin)</a>
  <a href="member.html" class="btn btn-member">সদস্য পোর্টাল (Member)</a>

  <div class="footer">
    &copy; 2026 AR-RABETA. All rights reserved.
  </div>
</div>

</body>
</html>
